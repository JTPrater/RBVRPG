<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Britannic Voyage - Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/front.css" />
    <link rel="stylesheet" href="/css/main.css" />
    <script src="/js/i18n.js"></script>
  </head>
  <body class="home">
    <header class="board">
      <nav class="board-links" aria-label="Pages">
        <a href="/main/list.html">Passenger List</a>
      </nav>
      <select class="lang-select" aria-label="Language"></select>
    </header>

    <main class="sheet">
      <div class="home-card">
        <h1 class="visually-hidden">Britannic Voyage</h1>
        <img
          class="logo"
          src="/images/ui/logo-ink.png"
          alt="Britannic Voyage Logo"
          width="490"
          height="276"
        />
        <figure class="plate">
          <img
            src="/images/ui/britannic-plate.jpg"
            alt=""
            width="1600"
            height="795"
          />
          <figcaption>
            Southampton · Cherbourg · Queenstown · New York
          </figcaption>
        </figure>
        <div id="countdown"></div>
        <div class="button-group">
          <button type="button" class="btn" id="climb-aboard-btn">
            Climb Aboard
          </button>
          <a href="/main/registration.html" class="btn" id="register-btn"
            >Register Now</a
          >
        </div>
      </div>
      <footer class="colophon">
        <p>&copy; 2025 RMS Britannic Voyage. All rights reserved.</p>
      </footer>
    </main>

    <div id="login-popup" class="veil" style="display: none">
      <div
        class="card login-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="login-title"
      >
        <button type="button" class="close-btn" aria-label="Close">
          &times;
        </button>
        <h2 id="login-title">Login</h2>
        <form id="login-form">
          <label for="email">Email:</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
          />
          <label for="password">Password:</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
          />
          <p id="login-error" class="form-error" role="alert" hidden></p>
          <button type="submit" class="btn">Login</button>
        </form>
      </div>
    </div>

    <!-- this browser's mark, sent as one logs in (for the moderators) -->
    <script src="/js/device.js"></script>
    <script src="/js/main.js"></script>
  </body>
</html>
