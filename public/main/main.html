<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Britannic Voyage - Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- External CSS -->
    <link rel="stylesheet" href="../css/main.css">
    <!-- Google Fonts for Art Deco Style -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Raleway:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar">
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/about">About</a></li>
            </ul>
            <div class="burger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="logo">
                <img src="../images/RMSBRITANNICPRIDEOFTHESEALOGO.png" alt="Britannic Voyage Logo">
            </div>
            <div id="countdown"></div>
            <a href="../main/registration.html" class="btn" id="register-btn" style="display: none;">Register Now</a>
            <button class="btn" id="climb-aboard-btn" style="display: none;">Climb Aboard</button>
        </section>
    </main>

    <div id="login-popup" class="login-popup" style="display: none;">
        <div class="login-popup-content">
            <span class="close-btn">&times;</span>
            <h2>Login</h2>
            <form id="login-form">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
                <button type="submit" class="btn">Login</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 RMS Britannic Voyage. All rights reserved.</p>
    </footer>

    <!-- External JavaScript -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
