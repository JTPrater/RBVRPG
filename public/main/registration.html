<!-- registration.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Britannic Voyage - Passenger Registration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/front.css" />
    <link rel="stylesheet" href="/css/registration.css" />
    <script src="/js/i18n.js"></script>
  </head>
  <body class="registration">
    <header class="board">
      <nav class="board-links" aria-label="Pages">
        <a href="/main/main.html">Home</a>
        <a href="/main/list.html">Passenger List</a>
        <a href="/main/main.html#login">Climb Aboard</a>
      </nav>
      <select class="lang-select" aria-label="Language"></select>
    </header>

    <main class="sheet">
      <div class="registration-container">
        <h1>Passenger Registration</h1>
        <form id="registrationForm" enctype="multipart/form-data" method="post">
          <div class="form-section passenger-fields">
            <div class="form-group portrait">
              <label for="avatar">Avatar (110x110px)</label>
              <div class="portrait-frame">
                <div
                  id="avatar-preview"
                  data-i18n-content="Choose a picture"
                ></div>
                <input
                  type="file"
                  id="avatar"
                  name="avatar"
                  accept="image/*"
                  title="Choose a picture"
                  required
                />
              </div>
            </div>

            <div class="form-group">
              <label for="forename">Forename</label>
              <input
                type="text"
                id="forename"
                name="forename"
                maxlength="40"
                autocomplete="off"
                required
              />
            </div>

            <div class="form-group">
              <label for="surname">Surname</label>
              <input
                type="text"
                id="surname"
                name="surname"
                maxlength="40"
                autocomplete="off"
                required
              />
            </div>

            <div class="form-group birth">
              <label for="birthdate">Birthdate</label>
              <input type="date" id="birthdate" name="birthdate" required />
              <span id="age-display"></span>
            </div>
          </div>

          <div class="form-section two-columns">
            <div class="form-group">
              <label for="cabin">Select Cabin Type</label>
              <select id="cabin" name="cabin" required>
                <option value="1st_class_cabins">1st Class Cabins</option>
              </select>
            </div>
            <div class="form-group">
              <label for="cabin_number">Select Cabin Number</label>
              <select id="cabin_number" name="cabin_number" required>
                <option value="">-- Select a cabin type first --</option>
              </select>
              <div
                id="cabin-capacity-info"
                class="capacity-info"
                style="display: none"
              >
                Seats: <span id="capacity-total"></span> — Seats left:
                <span id="capacity-left"></span>
              </div>
            </div>
            <div class="form-group departure">
              <span class="label">Departure</span>
              <span class="printed">Southampton, July 9th 1919, 9:30 AM</span>
              <input
                type="hidden"
                id="departure"
                name="departure"
                value="Southampton, July 9th 1919, 9:30 AM"
              />
            </div>
          </div>

          <div class="form-section two-columns">
            <div class="form-group">
              <label for="email">Email</label>
              <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                required
              />
            </div>

            <div class="form-group">
              <label for="password">Password</label>
              <input
                type="password"
                id="password"
                name="password"
                minlength="6"
                maxlength="72"
                autocomplete="new-password"
                required
              />
            </div>
          </div>

          <div class="form-section">
            <div class="form-group">
              <label for="bio">Character Biography</label>
              <textarea
                id="bio"
                name="bio"
                rows="7"
                maxlength="2000"
                required
              ></textarea>
            </div>
          </div>

          <div class="form-foot">
            <p id="form-error" class="form-error" role="alert" hidden></p>
            <button type="submit" class="btn">Register</button>
          </div>
        </form>
      </div>
      <footer class="colophon">
        <p>&copy; 2025 RMS Britannic Voyage. All rights reserved.</p>
      </footer>
    </main>

    <!-- this browser's mark, sent as one registers (for the moderators) -->
    <script src="/js/device.js"></script>
    <script src="/js/registration.js"></script>
  </body>
</html>
