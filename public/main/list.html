<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Britannic Voyage - Passenger List</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/list.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Raleway:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
    <!-- DOMPurify for XSS protection -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.7/purify.min.js"></script>
  </head>
  <body>
    <div class="container">
      <a href="/main/main.html" class="back-link">
        <i class="fas fa-arrow-left"></i> Return to Main
      </a>
      <h1>Passenger List</h1>
      <div class="passenger-grid" id="passengerGrid">
        <!-- Passengers will be inserted here dynamically -->
      </div>
    </div>

    <div id="passengerModal" class="modal">
      <div class="modal-content">
        <span class="close-btn">&times;</span>
        <div class="modal-avatar">
          <img src="" alt="Passenger Avatar" id="modalAvatar" />
        </div>
        <div class="modal-info">
          <h2 id="modalName"></h2>
          <div id="modalDob" class="dob"></div>
          <div id="modalCabin" class="cabin"></div>
          <div id="modalBio" class="bio"></div>
        </div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="../js/list.js"></script>
  </body>
</html>
